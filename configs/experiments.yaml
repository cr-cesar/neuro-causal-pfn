# Table 9 experiment programme: gates, defaults and dependency notes.
#
# This file documents the orchestration configuration in one place. The
# authoritative catalogue is code (src/neurocausalpfn/experiments/registry.py);
# this mirror is for humans and for overriding gate thresholds without editing
# code. The runner reads thresholds from the registry, not from here, unless you
# wire an override; keep the two in sync.

# Stop/go gates (section 13). kind: gate = hard stop; deprioritize = soft; info.
tiers:
  T1:  {metric: dice,      op: ">=", threshold: 0.70,  kind: gate,          note: "Reconstruction, Pombo baseline"}
  T2:  {metric: r2_nihss,  op: ">=", threshold: 0.05,  kind: deprioritize,  note: "Linear probe above chance"}
  T3:  {metric: active_dims, op: none, threshold: null, kind: info,         note: "Latent quality, no threshold"}
  T4:  {metric: root_pehe, op: "<",  threshold: 0.349, kind: gate,          note: "Beat Giles NMF-50"}

# Reference baselines available without any VAE training (section 13).
baselines:
  giles_nmf50_root_pehe: 0.349
  pombo_dice: 0.70
  nihss_r2_chance: 0.05

# Programme defaults.
run:
  seeds: 3                 # >= 3 random seeds per configuration (section 14)
  select_by: T4            # default winner criterion (lower root-PEHE)
  t4_estimator: ridge      # semi-synthetic Tier-4 estimator: ridge | gbm
  bootstrap_resamples: 1000

# Logging: auto -> wandb -> mlflow -> local JSON/CSV. Override with the
# NEUROCAUSAL_LOGGER environment variable or --backend.
logging:
  project: neuro-causal-pfn
  backend: auto

# Dependency order (Dependencies note, section 14). The runner enforces this.
dependencies:
  order: "E1 -> E2 -> E7 -> E3 -> E4; E5a,E6 after E7; E9a after E6; E9b after E9a"
  arm_a: [E1, E2, E7, E3, E4, E5a, E6, E9a, E9b]
  winners_propagated:
    E2: w_dice
    E7: backbone
    E3: dims
    E6: fusion_mode

# Mode-aware latent dimensionality. Prototype shrinks the full-mode dims so the
# whole programme runs on CPU; full mode keeps the specification's dims.
dims:
  prototype: {"25": 4, "50": 8, "75": 12, "100": 16}
  full: identity
